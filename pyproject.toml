[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-retrieval-lab"
version = "0.1.0"
description = "Reproducible lexical and semantic retrieval experiments on BEIR SciFact"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dense = ["sentence-transformers==3.4.1", "transformers>=4.41,<4.49", "numpy>=1.26,<2"]
service = ["fastapi>=0.110,<1", "pydantic>=2,<3", "uvicorn>=0.27,<1"]
test = ["httpx>=0.27,<1"]

[project.scripts]
evidence-lab = "evidence_lab.cli:main"

[tool.setuptools.packages.find]
include = ["evidence_lab*"]

[tool.setuptools.package-data]
evidence_lab = ["dashboard.html"]
